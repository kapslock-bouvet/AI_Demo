name: Build and deploy React app

on:
  push:
    branches:
      - '**'
    tags:
      - 'deploy-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: Forme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Forme/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Print greeting
        run: echo "hellow kapil"
      - name: Test greeting
        run: npm test
      - name: Test deployment command
        working-directory: .
        run: node --test commands/deploy.test.mjs
      - name: Configure GitHub Pages
        if: startsWith(github.ref, 'refs/tags/deploy-')
        id: pages
        uses: actions/configure-pages@v5
      - name: Build app
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}/
        run: npm run build -- --base "$BASE_PATH"
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: hello-kapil-dist
          path: Forme/dist
          if-no-files-found: error
      - name: Upload GitHub Pages build
        if: startsWith(github.ref, 'refs/tags/deploy-')
        uses: actions/upload-pages-artifact@v3
        with:
          path: Forme/dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/deploy-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/deploy-')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "Release $TAG"
